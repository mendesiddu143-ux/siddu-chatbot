<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ManDot AI — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0a0a0f; --surface2: #1a1a24; --border: rgba(255,255,255,0.07);
            --accent: #7c6aff; --accent2: #ff6ab0; --accent3: #6affd4;
            --text: #f0eeff; --text-dim: #8880aa;
        }
        html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }
        #starsCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        body::before {
            content: ''; position: fixed; inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 10% 0%, rgba(124,106,255,0.12) 0%, transparent 70%),
                radial-gradient(ellipse 50% 40% at 90% 100%, rgba(106,255,212,0.07) 0%, transparent 70%);
            pointer-events: none; z-index: 1;
        }
        .container { position: relative; z-index: 2; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: var(--surface2); border: 1px solid var(--border); border-radius: 24px; padding: 40px; width: 100%; max-width: 420px; animation: fadeUp 0.6s ease both; }
        .logo { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 28px; }
        .logo-icon { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 14px; color: white; box-shadow: 0 0 20px rgba(124,106,255,0.4); }
        .logo-text { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 24px; background: linear-gradient(90deg, var(--text) 0%, var(--accent) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .tabs { display: flex; background: rgba(255,255,255,0.04); border-radius: 12px; padding: 4px; margin-bottom: 28px; }
        .tab-btn { flex: 1; padding: 9px; border-radius: 9px; border: none; background: transparent; color: var(--text-dim); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
        .tab-btn.active { background: var(--accent); color: white; box-shadow: 0 4px 12px rgba(124,106,255,0.3); }
        .form { display: none; flex-direction: column; gap: 16px; }
        .form.active { display: flex; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 12px; color: var(--text-dim); font-weight: 500; }
        .form-group input { background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color 0.2s; }
        .form-group input:focus { border-color: rgba(124,106,255,0.5); }
        .form-group input::placeholder { color: var(--text-dim); }
        .submit-btn { padding: 13px; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--accent), #9b6aff); color: white; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: 'Syne', sans-serif; box-shadow: 0 4px 14px rgba(124,106,255,0.35); margin-top: 4px; }
        .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,106,255,0.5); }
        .submit-btn:active { transform: scale(0.98); }
        .error-msg { background: rgba(255,68,68,0.1); border: 1px solid rgba(255,68,68,0.3); border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #ff6b6b; display: none; }
        .error-msg.show { display: block; }
        .success-msg { background: rgba(106,255,212,0.1); border: 1px solid rgba(106,255,212,0.3); border-radius: 10px; padding: 10px 14px; font-size: 13px; color: var(--accent3); display: none; }
        .success-msg.show { display: block; }
        .divider { text-align: center; font-size: 12px; color: var(--text-dim); margin: 4px 0; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
<canvas id="starsCanvas"></canvas>
<div class="container">
    <div class="card">
        <div class="logo">
            <div class="logo-icon">M•AI</div>
            <span class="logo-text">ManDot AI</span>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Login Form -->
        <div class="form active" id="loginForm">
            <div class="error-msg" id="loginError"></div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password">
            </div>
            <button class="submit-btn" onclick="handleLogin()">🚀 Login to ManDot AI</button>
        </div>

        <!-- Signup Form -->
        <div class="form" id="signupForm">
            <div class="error-msg" id="signupError"></div>
            <div class="success-msg" id="signupSuccess"></div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signupName" placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="signupEmail" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signupPassword" placeholder="Min 6 characters">
            </div>
            <button class="submit-btn" onclick="handleSignup()">✨ Create Account</button>
        </div>
    </div>
</div>

<script>
// Stars
const canvas=document.getElementById('starsCanvas');
const ctx=canvas.getContext('2d');
let stars=[];
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
function createStars(count){stars=[];for(let i=0;i<count;i++){stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.4+0.2,alpha:Math.random()*0.7+0.15,twinkleSpeed:Math.random()*0.008+0.002,twinkleDir:Math.random()>0.5?1:-1});}}
function drawStars(){ctx.clearRect(0,0,canvas.width,canvas.height);for(const s of stars){s.alpha+=s.twinkleSpeed*s.twinkleDir;if(s.alpha>=0.85||s.alpha<=0.1)s.twinkleDir*=-1;ctx.save();ctx.globalAlpha=s.alpha;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`hsl(${220+Math.random()*60},60%,90%)`;ctx.fill();ctx.restore();}requestAnimationFrame(drawStars);}
resizeCanvas();createStars(180);drawStars();
window.addEventListener('resize',()=>{resizeCanvas();createStars(180);});

function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',(i===0&&tab==='login')||(i===1&&tab==='signup')));
    document.getElementById('loginForm').classList.toggle('active', tab==='login');
    document.getElementById('signupForm').classList.toggle('active', tab==='signup');
}

async function handleLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorEl = document.getElementById('loginError');
    if(!email || !password){ errorEl.textContent='Please fill all fields!'; errorEl.classList.add('show'); return; }
    errorEl.classList.remove('show');
    try {
        const res = await fetch('/login', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:`email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`});
        const data = await res.json();
        if(data.success){ window.location.href='/'; }
        else{ errorEl.textContent=data.error; errorEl.classList.add('show'); }
    } catch(e){ errorEl.textContent='Something went wrong!'; errorEl.classList.add('show'); }
}

async function handleSignup() {
    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const errorEl = document.getElementById('signupError');
    const successEl = document.getElementById('signupSuccess');
    if(!name || !email || !password){ errorEl.textContent='Please fill all fields!'; errorEl.classList.add('show'); return; }
    errorEl.classList.remove('show'); successEl.classList.remove('show');
    try {
        const res = await fetch('/signup', {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:`name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`});
        const data = await res.json();
        if(data.success){ window.location.href='/'; }
        else{ errorEl.textContent=data.error; errorEl.classList.add('show'); }
    } catch(e){ errorEl.textContent='Something went wrong!'; errorEl.classList.add('show'); }
}

// Enter key support
document.addEventListener('keydown', e => {
    if(e.key==='Enter'){
        if(document.getElementById('loginForm').classList.contains('active')) handleLogin();
        else handleSignup();
    }
});
</script>
</body>
</html>
