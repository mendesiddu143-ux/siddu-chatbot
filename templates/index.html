<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Useless 8.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0f;
            --surface2: #1a1a24;
            --border: rgba(255,255,255,0.07);
            --accent: #7c6aff;
            --accent2: #ff6ab0;
            --accent3: #6affd4;
            --text: #f0eeff;
            --text-dim: #8880aa;
            --user-bubble: #1e1b3a;
            --ai-bubble: #141420;
        }

        html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow: hidden; }

        /* Stars canvas */
        #starsCanvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* Ambient glow on top of stars */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 60% 50% at 10% 0%, rgba(124,106,255,0.1) 0%, transparent 70%),
                radial-gradient(ellipse 50% 40% at 90% 100%, rgba(106,255,212,0.06) 0%, transparent 70%),
                radial-gradient(ellipse 40% 30% at 80% 10%, rgba(255,106,176,0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        .app {
            position: relative; z-index: 2;
            display: flex; flex-direction: column;
            height: 100vh; max-width: 860px;
            margin: 0 auto; padding: 0 16px;
        }

        header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 24px 0 16px; border-bottom: 1px solid var(--border);
            flex-shrink: 0; animation: fadeDown 0.6s ease both;
        }

        .logo { display: flex; align-items: center; gap: 12px; }

        .logo-icon {
            width: 40px; height: 40px; border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex; align-items: center; justify-content: center;
            font-family: 'Syne', sans-serif; font-weight: 800; font-size: 15px; color: white;
            box-shadow: 0 0 20px rgba(124,106,255,0.4);
            letter-spacing: -0.5px;
        }

        .logo-text {
            font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px;
            background: linear-gradient(90deg, var(--text) 0%, var(--accent) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .status-pill {
            display: flex; align-items: center; gap: 7px;
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: 999px; padding: 6px 14px;
            font-size: 12px; color: var(--text-dim); letter-spacing: 0.03em;
        }

        .status-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--accent3); box-shadow: 0 0 8px var(--accent3);
            animation: pulse 2s ease-in-out infinite;
        }

        .chat-area {
            flex: 1; overflow-y: auto; padding: 28px 0 8px;
            display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth;
        }

        .chat-area::-webkit-scrollbar { width: 4px; }
        .chat-area::-webkit-scrollbar-track { background: transparent; }
        .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .welcome {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; flex: 1; gap: 16px; text-align: center;
            padding: 40px 0; animation: fadeUp 0.8s ease both 0.2s;
        }

        .welcome-icon {
            width: 68px; height: 68px; border-radius: 20px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex; align-items: center; justify-content: center;
            font-family: 'Syne', sans-serif; font-weight: 800; font-size: 20px; color: white;
            box-shadow: 0 0 40px rgba(124,106,255,0.35), 0 0 80px rgba(124,106,255,0.1);
            margin-bottom: 4px; letter-spacing: -0.5px;
        }

        .welcome h2 { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 700; }
        .welcome p { font-size: 15px; color: var(--text-dim); max-width: 340px; line-height: 1.6; }

        .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }

        .suggestion-chip {
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: 10px; padding: 9px 16px; font-size: 13px;
            color: var(--text-dim); cursor: pointer; transition: all 0.2s ease;
        }

        .suggestion-chip:hover {
            border-color: var(--accent); color: var(--text);
            background: rgba(124,106,255,0.1); transform: translateY(-1px);
        }

        .message { display: flex; gap: 12px; animation: fadeUp 0.35s ease both; }
        .message.user { flex-direction: row-reverse; }

        .avatar {
            width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Syne', sans-serif; font-weight: 700; font-size: 11px; margin-top: 2px;
        }

        .avatar.user-av { background: linear-gradient(135deg, #3a3a5c, #2a2a44); border: 1px solid rgba(124,106,255,0.3); color: var(--accent); }
        .avatar.ai-av { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; box-shadow: 0 0 14px rgba(124,106,255,0.3); font-size: 9px; letter-spacing: -0.3px; }

        .bubble { max-width: 72%; padding: 14px 18px; border-radius: 16px; font-size: 14.5px; line-height: 1.7; }
        .message.user .bubble { background: var(--user-bubble); border: 1px solid rgba(124,106,255,0.2); border-top-right-radius: 4px; }
        .message.ai .bubble { background: var(--ai-bubble); border: 1px solid var(--border); border-top-left-radius: 4px; }

        .bubble .sender { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 6px; }
        .message.user .sender { color: var(--accent); text-align: right; }
        .message.ai .sender { color: var(--accent3); }

        .typing-bubble { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
        .typing-bubble span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); animation: bounce 1.3s ease-in-out infinite; }
        .typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
        .typing-bubble span:nth-child(3) { animation-delay: 0.3s; }

        .input-area { padding: 16px 0 24px; flex-shrink: 0; animation: fadeUp 0.6s ease both 0.1s; }

        .input-wrapper {
            display: flex; align-items: flex-end; gap: 10px;
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: 16px; padding: 10px 10px 10px 18px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: rgba(124,106,255,0.5);
            box-shadow: 0 0 0 3px rgba(124,106,255,0.08);
        }

        textarea {
            flex: 1; background: transparent; border: none; outline: none;
            color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 15px;
            resize: none; line-height: 1.6; max-height: 140px; min-height: 24px; overflow-y: auto;
        }

        textarea::placeholder { color: var(--text-dim); }

        .send-btn {
            width: 40px; height: 40px; border-radius: 11px; border: none;
            background: linear-gradient(135deg, var(--accent), #9b6aff);
            color: white; cursor: pointer; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
            box-shadow: 0 4px 14px rgba(124,106,255,0.35);
        }

        .send-btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(124,106,255,0.5); }
        .send-btn:active { transform: scale(0.96); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .send-btn svg { width: 18px; height: 18px; }

        .input-hint { text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 10px; opacity: 0.6; }

        @keyframes fadeDown { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-6px); opacity: 1; } }
    </style>
</head>
<body>

<canvas id="starsCanvas"></canvas>

<div class="app">
    <header>
        <div class="logo">
            <div class="logo-icon">8.0</div>
            <span class="logo-text">Useless 8.0</span>
        </div>
        <div class="status-pill">
            <span class="status-dot"></span>
            Online
        </div>
    </header>

    <div class="chat-area" id="chatArea">
        <div class="welcome" id="welcomeScreen">
            <div class="welcome-icon">8.0</div>
            <h2>How can I help you?</h2>
            <p>Ask me anything. I'm SIDDU — here to assist, explain, and explore ideas with you.</p>
            <div class="suggestions">
                <div class="suggestion-chip" onclick="fillInput(this)">✨ What can you do?</div>
                <div class="suggestion-chip" onclick="fillInput(this)">💡 Give me a creative idea</div>
                <div class="suggestion-chip" onclick="fillInput(this)">📖 Explain something complex</div>
                <div class="suggestion-chip" onclick="fillInput(this)">🚀 Help me with my project</div>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="messageInput" placeholder="Message Useless 8.0..." rows="1"
                onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
        <p class="input-hint">Enter to send · Shift+Enter for new line</p>
    </div>
</div>

<script>
    // ── Stars ──
    const canvas = document.getElementById('starsCanvas');
    const ctx = canvas.getContext('2d');

    let stars = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    function createStars(count) {
        stars = [];
        for (let i = 0; i < count; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 1.4 + 0.2,
                alpha: Math.random() * 0.7 + 0.15,
                twinkleSpeed: Math.random() * 0.008 + 0.002,
                twinkleDir: Math.random() > 0.5 ? 1 : -1,
                // a few bright "sparkle" stars
                sparkle: Math.random() > 0.93
            });
        }
    }

    function drawStars() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const s of stars) {
            // twinkle
            s.alpha += s.twinkleSpeed * s.twinkleDir;
            if (s.alpha >= 0.85 || s.alpha <= 0.1) s.twinkleDir *= -1;

            ctx.save();
            ctx.globalAlpha = s.alpha;

            if (s.sparkle) {
                // 4-point star shape for sparkle stars
                ctx.translate(s.x, s.y);
                const len = s.r * 3.5;
                ctx.beginPath();
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 2) {
                    const outer = len;
                    const inner = len * 0.25;
                    const midA = a + Math.PI / 4;
                    if (a === 0) ctx.moveTo(Math.cos(a) * outer, Math.sin(a) * outer);
                    else ctx.lineTo(Math.cos(a) * outer, Math.sin(a) * outer);
                    ctx.lineTo(Math.cos(midA) * inner, Math.sin(midA) * inner);
                }
                ctx.closePath();
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = '#a090ff';
                ctx.shadowBlur = 8;
                ctx.fill();
            } else {
                // regular circle star
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                // slight color variation
                const hue = 220 + Math.random() * 60;
                ctx.fillStyle = `hsl(${hue}, 60%, 90%)`;
                ctx.shadowColor = '#8877ff';
                ctx.shadowBlur = s.r > 1 ? 4 : 0;
                ctx.fill();
            }
            ctx.restore();
        }
        requestAnimationFrame(drawStars);
    }

    resizeCanvas();
    createStars(220);
    drawStars();

    window.addEventListener('resize', () => {
        resizeCanvas();
        createStars(220);
    });

    // ── Chat ──
    const chatArea = document.getElementById('chatArea');
    const input = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    let welcomeRemoved = false;

    function fillInput(chip) {
        input.value = chip.textContent.replace(/^[^\w]+/, '').trim();
        input.focus();
        autoResize(input);
    }

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 140) + 'px';
    }

    function handleKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    function removeWelcome() {
        if (!welcomeRemoved) {
            const ws = document.getElementById('welcomeScreen');
            if (ws) ws.remove();
            welcomeRemoved = true;
        }
    }

    function escapeHtml(t) {
        return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function appendMessage(role, text) {
        removeWelcome();
        const isUser = role === 'user';
        const div = document.createElement('div');
        div.className = `message ${isUser ? 'user' : 'ai'}`;
        div.innerHTML = `
            <div class="avatar ${isUser ? 'user-av' : 'ai-av'}">${isUser ? 'You' : '8.0'}</div>
            <div class="bubble">
                <div class="sender">${isUser ? 'You' : 'Useless 8.0'}</div>
                ${escapeHtml(text).replace(/\n/g, '<br>')}
            </div>`;
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function appendTyping() {
        removeWelcome();
        const div = document.createElement('div');
        div.className = 'message ai';
        div.id = 'typingIndicator';
        div.innerHTML = `
            <div class="avatar ai-av">8.0</div>
            <div class="bubble">
                <div class="sender">Useless 8.0</div>
                <div class="typing-bubble"><span></span><span></span><span></span></div>
            </div>`;
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function removeTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        autoResize(input);
        sendBtn.disabled = true;
        appendMessage('user', text);
        appendTyping();

        try {
            const response = await fetch('/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `message=${encodeURIComponent(text)}`
            });
            const data = await response.json();
            removeTyping();
            appendMessage('ai', data.reply || data.response || 'No response.');
        } catch (err) {
            removeTyping();
            appendMessage('ai', 'Something went wrong. Please try again.');
        }

        sendBtn.disabled = false;
        input.focus();
    }
</script>
</body>
</html>
